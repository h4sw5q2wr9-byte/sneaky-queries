name: Telegram project notifications
on:
  workflow_run:
    workflows: [Deploy Sneaky Queries to Pages, Multiplayer and security checks]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    # Only run trusted default-branch code with notification credentials.
    if: github.event.workflow_run.event != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify Telegram if configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SQ_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          SQ_WORKFLOW_STATUS: ${{ github.event.workflow_run.conclusion }}
          SQ_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python scripts/notify-telegram.py
